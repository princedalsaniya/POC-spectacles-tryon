<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Om Optics | Virtual Try-On</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-light: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --radius: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            overflow-x: hidden;
        }

        /* ===== HEADER ===== */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--surface-light);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        /* ===== SCREENS ===== */
        .screen { display: none; }
        .screen.active { display: flex; flex-direction: column; }

        /* ===== HOME SCREEN ===== */
        #home-screen {
            min-height: calc(100dvh - 65px);
            padding: 24px 20px;
            gap: 32px;
        }


        .frames-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .frame-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .frame-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.15);
        }

        .frame-card img {
            width: 100%;
            max-width: 260px;
            height: 120px;
            object-fit: contain;
            background: #fff;
            border-radius: 8px;
            padding: 12px;
        }

        .frame-card .frame-info {
            text-align: center;
        }

        .frame-card .frame-name {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .frame-card .frame-name {
            text-align: center;
        }

        /* ===== TRY-ON SCREEN ===== */
        #tryon-screen {
            height: 100dvh;
            position: relative;
            overflow: hidden;
        }

        .tryon-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
        }

        .back-btn {
            background: var(--surface-light);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tryon-title {
            font-size: 16px;
            font-weight: 600;
        }

        .camera-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #webcam {
            position: absolute;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: scaleX(-1);
        }

        #overlay-canvas {
            position: absolute;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            pointer-events: none;
            transform: scaleX(-1);
        }

        /* Loading overlay */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 20;
        }

        .loading-overlay.hidden { display: none; }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--surface-light);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Bottom frame switcher */
        .frame-switcher {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px;
            background: linear-gradient(transparent, rgba(15, 23, 42, 0.95));
            z-index: 10;
        }

        .switcher-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .switcher-scroll::-webkit-scrollbar { display: none; }

        .switcher-item {
            flex-shrink: 0;
            width: 80px;
            height: 56px;
            background: var(--surface);
            border-radius: 10px;
            border: 2px solid transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            scroll-snap-align: center;
            transition: all 0.2s;
        }

        .switcher-item.active {
            border-color: var(--accent);
            background: rgba(56, 189, 248, 0.15);
        }

        .switcher-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }

        .switcher-item.active img {
            filter: none;
        }

        /* Action buttons */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 12px;
        }

        .action-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .action-btn:hover { background: var(--primary-dark); transform: scale(1.05); }

        .action-btn.secondary {
            background: var(--surface-light);
        }

        /* Status message */
        .status-toast {
            position: fixed;
            bottom: 160px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(34, 197, 94, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .status-toast.show { opacity: 1; }

        /* ===== NO CAMERA FALLBACK ===== */
        .no-camera {
            text-align: center;
            padding: 40px 20px;
        }

        .no-camera h2 { margin-bottom: 12px; }
        .no-camera p { color: var(--text-muted); margin-bottom: 24px; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .frames-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- HOME SCREEN -->
    <div id="home-screen" class="screen active">
        <header>
            <div class="logo">
                <div class="logo-icon">👓</div>
                <span>Om Optics</span>
            </div>
        </header>
        <div>
            <div class="frames-grid" id="frames-grid"></div>
        </div>
    </div>

    <!-- TRY-ON SCREEN -->
    <div id="tryon-screen" class="screen">
        <div class="tryon-header">
            <button class="back-btn" onclick="goHome()">←</button>
            <span class="tryon-title" id="tryon-title">Try On</span>
            <div style="width:40px"></div>
        </div>

        <div class="camera-container">
            <video id="webcam" autoplay playsinline muted></video>
            <canvas id="overlay-canvas"></canvas>

            <div class="loading-overlay" id="loading-overlay">
                <div class="spinner"></div>
                <div class="loading-text">Starting camera & loading face detection...</div>
            </div>
        </div>

        <div class="frame-switcher">
            <div class="switcher-scroll" id="switcher-scroll"></div>
            <div class="action-buttons">
                <button class="action-btn" onclick="captureAndDownload()">📸 Capture</button>
            </div>
        </div>

        <div class="status-toast" id="status-toast"></div>
    </div>

    <!-- MediaPipe Vision -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs"
            crossorigin="anonymous" type="module"></script>

    <script type="module">
        const visionModule = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs");
        const FaceLandmarker = visionModule.FaceLandmarker;
        const FilesetResolver = visionModule.FilesetResolver;

        console.log("MediaPipe loaded:", { FaceLandmarker, FilesetResolver });
        console.log("Available methods:", Object.getOwnPropertyNames(FaceLandmarker));

        // ===== FRAME DATA =====
        const FRAMES = [
            {
                id: "clubmaster",
                name: "Classic Clubmaster",
                image: "frames/frame1-spectacles.png",
                // Tuning: how much wider than eye-to-eye distance
                widthMultiplier: 2.1,
                // Vertical offset from eye center (negative = up)
                yOffset: 0.05,
            },
            {
                id: "rectangle",
                name: "Modern Rectangle",
                image: "frames/frame2-sunglasses.png",
                widthMultiplier: 2.0,
                yOffset: 0.1,
            }
        ];

        let faceLandmarker = null;
        let video = null;
        let canvas = null;
        let ctx = null;
        let currentFrameIndex = 0;
        let frameImages = {};
        let animFrameId = null;

        // ===== INIT HOME =====
        function initHome() {
            const grid = document.getElementById("frames-grid");
            grid.innerHTML = FRAMES.map((f, i) => `
                <div class="frame-card" onclick="window._startTryOn(${i})">
                    <img src="${f.image}" alt="${f.name}">
                    <div class="frame-name">${f.name}</div>
                </div>
            `).join("");
        }

        // ===== PRELOAD FRAME IMAGES =====
        function preloadFrames() {
            return Promise.all(FRAMES.map(f => new Promise((resolve) => {
                const img = new Image();
                img.onload = () => { frameImages[f.id] = img; resolve(); };
                img.onerror = () => resolve();
                img.src = f.image;
            })));
        }

        // ===== INIT FACE LANDMARKER =====
        async function initFaceLandmarker() {
            const filesetResolver = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm"
            );

            faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
                    delegate: "GPU"
                },
                outputFaceBlendshapes: false,
                outputFacialTransformationMatrixes: true,
                runningMode: "VIDEO",
                numFaces: 1
            });
        }

        // ===== START CAMERA =====
        async function startCamera() {
            video = document.getElementById("webcam");
            canvas = document.getElementById("overlay-canvas");
            ctx = canvas.getContext("2d");

            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: "user",
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            });

            video.srcObject = stream;

            return new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    resolve();
                };
            });
        }

        // ===== RENDER LOOP =====
        function renderLoop() {
            if (!faceLandmarker || !video || video.paused || video.ended) {
                animFrameId = requestAnimationFrame(renderLoop);
                return;
            }

            const results = faceLandmarker.detectForVideo(video, performance.now());

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (results.faceLandmarks && results.faceLandmarks.length > 0) {
                const landmarks = results.faceLandmarks[0];
                drawGlasses(landmarks);
            }

            animFrameId = requestAnimationFrame(renderLoop);
        }

        // ===== DRAW GLASSES =====
        function drawGlasses(landmarks) {
            const frame = FRAMES[currentFrameIndex];
            const img = frameImages[frame.id];
            if (!img) return;

            const w = canvas.width;
            const h = canvas.height;

            // Key landmarks (MediaPipe face mesh indices)
            // 33 = right eye outer, 263 = left eye outer (mirrored because camera is flipped)
            // 159 = right eye top, 386 = left eye top
            // 145 = right eye bottom, 374 = left eye bottom
            // 6 = nose bridge top
            // 168 = between eyebrows

            const leftEyeOuter = landmarks[263];  // In mirrored view
            const rightEyeOuter = landmarks[33];
            const leftEyeInner = landmarks[362];
            const rightEyeInner = landmarks[133];
            const noseBridge = landmarks[6];
            const foreheadCenter = landmarks[10];
            const leftTemple = landmarks[454];
            const rightTemple = landmarks[234];

            // Calculate eye center positions
            // Both video and canvas are CSS-mirrored, so use raw landmark coords
            const leftEyeCenter = {
                x: ((leftEyeOuter.x + leftEyeInner.x) / 2) * w,
                y: ((leftEyeOuter.y + leftEyeInner.y) / 2) * h
            };

            const rightEyeCenter = {
                x: ((rightEyeOuter.x + rightEyeInner.x) / 2) * w,
                y: ((rightEyeOuter.y + rightEyeInner.y) / 2) * h
            };

            // Distance between eyes
            const eyeDist = Math.sqrt(
                Math.pow(rightEyeCenter.x - leftEyeCenter.x, 2) +
                Math.pow(rightEyeCenter.y - leftEyeCenter.y, 2)
            );

            // Glasses dimensions
            const glassesWidth = eyeDist * frame.widthMultiplier;
            const aspectRatio = img.naturalHeight / img.naturalWidth;
            const glassesHeight = glassesWidth * aspectRatio;

            // Center between eyes
            const centerX = (leftEyeCenter.x + rightEyeCenter.x) / 2;
            const centerY = (leftEyeCenter.y + rightEyeCenter.y) / 2;

            // Rotation angle to align with eyes
            const angle = Math.atan2(
                rightEyeCenter.y - leftEyeCenter.y,
                rightEyeCenter.x - leftEyeCenter.x
            );

            // Apply vertical offset
            const offsetY = glassesHeight * frame.yOffset;

            // Draw with rotation (flip vertically to correct upside-down frames)
            ctx.save();
            ctx.translate(centerX, centerY + offsetY);
            ctx.rotate(angle);
            ctx.scale(1, -1);
            ctx.drawImage(
                img,
                -glassesWidth / 2,
                -glassesHeight / 2,
                glassesWidth,
                glassesHeight
            );
            ctx.restore();
        }

        // ===== NAVIGATION =====
        window._startTryOn = async function(frameIndex) {
            currentFrameIndex = frameIndex;

            document.getElementById("home-screen").classList.remove("active");
            document.getElementById("tryon-screen").classList.add("active");
            document.getElementById("tryon-title").textContent = FRAMES[frameIndex].name;
            document.getElementById("loading-overlay").classList.remove("hidden");

            buildSwitcher();

            try {
                await Promise.all([
                    startCamera(),
                    faceLandmarker ? Promise.resolve() : initFaceLandmarker()
                ]);

                document.getElementById("loading-overlay").classList.add("hidden");
                renderLoop();
            } catch (err) {
                console.error("Init error:", err);
                document.getElementById("loading-overlay").innerHTML = `
                    <div class="no-camera">
                        <h2>📷 Camera Access Needed</h2>
                        <p>Please allow camera access to use virtual try-on. ${err.message}</p>
                        <button class="try-btn" onclick="window.location.reload()" style="width:auto;padding:12px 32px;">
                            Retry
                        </button>
                    </div>
                `;
            }
        };

        window.goHome = function() {
            if (animFrameId) cancelAnimationFrame(animFrameId);
            if (video && video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
                video.srcObject = null;
            }
            document.getElementById("tryon-screen").classList.remove("active");
            document.getElementById("home-screen").classList.add("active");
        };

        // ===== FRAME SWITCHER =====
        function buildSwitcher() {
            const scroll = document.getElementById("switcher-scroll");
            scroll.innerHTML = FRAMES.map((f, i) => `
                <div class="switcher-item ${i === currentFrameIndex ? 'active' : ''}"
                     onclick="window._switchFrame(${i})">
                    <img src="${f.image}" alt="${f.name}">
                </div>
            `).join("");
        }

        window._switchFrame = function(index) {
            currentFrameIndex = index;
            document.getElementById("tryon-title").textContent = FRAMES[index].name;
            document.querySelectorAll(".switcher-item").forEach((el, i) => {
                el.classList.toggle("active", i === index);
            });
        };

        // ===== CAPTURE & SAVE =====
        window.captureAndDownload = function() {
            if (!video || !canvas) return;

            const captureCanvas = document.createElement("canvas");
            captureCanvas.width = canvas.width;
            captureCanvas.height = canvas.height;
            const captureCtx = captureCanvas.getContext("2d");

            // Draw mirrored video
            captureCtx.save();
            captureCtx.scale(-1, 1);
            captureCtx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
            captureCtx.restore();

            // Draw overlay
            captureCtx.drawImage(canvas, 0, 0);

            // Trigger download
            const link = document.createElement("a");
            link.download = `om-optics-tryon-${Date.now()}.png`;
            link.href = captureCanvas.toDataURL("image/png");
            link.click();
            showToast("📸 Photo saved!");
        };

        function showToast(msg) {
            const toast = document.getElementById("status-toast");
            toast.textContent = msg;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 2500);
        }

        // ===== BOOT =====
        initHome();
        preloadFrames();
    </script>

</body>
</html>
